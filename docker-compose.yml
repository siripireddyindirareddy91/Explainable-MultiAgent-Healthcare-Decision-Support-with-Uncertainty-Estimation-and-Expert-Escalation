services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: clinixai
      POSTGRES_USER: clinixai
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clinixai"]
      interval: 5s
      retries: 10
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://clinixai:${POSTGRES_PASSWORD}@database:5432/clinixai
      DEMO_MODE: "true"
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      CORS_ORIGINS: http://localhost:3000
    ports: ["8000:8000"]
    depends_on:
      database:
        condition: service_healthy
volumes:
  postgres_data:
